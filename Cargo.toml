# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "2"
members = [
    "agent",         # ringzero-daemon: loader + policy engine
    "cli",           # rz: command-line interface
    "checks",        # ringzero-checks: deterministic scorers (never in the syscall path)
    "app/src-tauri", # ringzero-app: desktop viewer (talks to the local API only)
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
authors    = ["Ring Zero Security"]
license    = "Apache-2.0"
repository = "https://github.com/ringzerosec/jev-runtime-security"

[workspace.dependencies]
tokio              = { version = "1", features = ["full"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "0.8"
blake3             = "1"
sha2               = "0.10"
regex              = "1"
keyring            = "2"
notify             = "6"
yara-x             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow             = "1"
thiserror          = "1"
async-trait        = "0.1"
uuid               = { version = "1", features = ["v4"] }
chrono             = { version = "0.4", features = ["serde"] }
sled               = "0.34"
walkdir            = "2"
once_cell          = "1"
nix                = { version = "0.29", features = ["user", "hostname"] }
clap               = { version = "4", features = ["derive"] }

[profile.release]
# Ship without debug symbols: they are ~60% of the daemon and ~30% of the CLI,
# and a released .deb is not where anyone debugs from. Build locally with
# `cargo build` (dev) or `--profile release-debug` when you need a backtrace.
strip = "symbols"

[profile.release-debug]
inherits = "release"
strip = "none"
debug = 1
