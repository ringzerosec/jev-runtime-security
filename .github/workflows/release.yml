# SPDX-License-Identifier: Apache-2.0
# Third-party actions are pinned to a commit SHA, not a tag.
#
# A tag is mutable: whoever controls the action repository can move v4 to new
# code, and that code runs in a job with this repository checked out and,
# in the release workflow, a token that can publish. Pinning to a SHA means an
# update is a commit here that someone reviews. The trailing comment on each
# line is the tag or branch that SHA was resolved from.
#
# dtolnay/rust-toolchain encodes the channel in the BRANCH, so `# stable` there
# is not a version — it is the branch whose action.yml defaults `toolchain` to
# stable. The pinned commit keeps that default; check action.yml before moving
# it, because a SHA from a different branch would silently change the channel.
name: release

# Tag a version to publish packages:  git tag v0.1.0 && git push origin v0.1.0
# Every merge to main also refreshes the "latest" pre-release, so the newest
# build is always downloadable.
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

# One "latest" publish at a time; a newer merge replaces an older one in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  deb:
    name: .deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev \
            pkg-config libssl-dev dpkg-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      # bpftool generates vmlinux.h for the eBPF build. Ubuntu 24.04 runners have
      # no bpftool package, and their kernel-tools packages do not ship it, so
      # take the bpftool project's own static release, pinned and checksummed.
      - name: Install bpftool (pinned static release)
        env:
          BPFTOOL_VERSION: v7.7.0
          SHA256_amd64: 09150596f09356b0ff632dd7f9856e0ea86bf96b269e9bc94278d9a9432a268c
          SHA256_arm64: d68443d945c146080151eb215bebaa400294ab7ada22af4f5d0a940f5992b9d9
        run: |
          arch=${{ matrix.arch }}
          # Download outside the checkout, so the build's version is not "dirty".
          tgz="$RUNNER_TEMP/bpftool-${BPFTOOL_VERSION}-${arch}.tar.gz"
          curl -fsSL -o "$tgz" "https://github.com/libbpf/bpftool/releases/download/${BPFTOOL_VERSION}/${tgz}"
          want_var="SHA256_${arch}"
          echo "${!want_var}  $tgz" | sha256sum -c -
          git status --porcelain
          mkdir -p "$RUNNER_TEMP/bpftool"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/bpftool"
          BPFTOOL=$(find "$RUNNER_TEMP/bpftool" -name bpftool -type f | head -1)
          chmod +x "$BPFTOOL"
          "$BPFTOOL" version
          echo "BPFTOOL=$BPFTOOL" >> "$GITHUB_ENV"

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Build both packages
        run: bash build-deb.sh

      - name: Checksum both packages
        run: |
          cd target/deb
          test -f ringzero-security_*_${{ matrix.arch }}.deb
          test -f ringzero-desktop_*_${{ matrix.arch }}.deb
          # build-deb.sh skips the eBPF build when the host has no kernel BTF; a
          # package without the kernel objects would enforce nothing, so refuse it.
          dpkg -c ringzero-security_*_${{ matrix.arch }}.deb | grep -q 'usr/lib/ringzero/ringzero.bpf.o'
          dpkg -c ringzero-security_*_${{ matrix.arch }}.deb | grep -q 'usr/lib/ringzero/stdiocap.bpf.o'
          echo "both eBPF objects are in the package"
          sha256sum *.deb > SHA256SUMS-${{ matrix.arch }}.txt
          cat SHA256SUMS-${{ matrix.arch }}.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-${{ matrix.arch }}
          path: |
            target/deb/*.deb
            target/deb/SHA256SUMS-*.txt

  publish:
    name: publish release
    needs: deb
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: List what is being published
        run: ls -la dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.deb
            dist/SHA256SUMS-*.txt
          generate_release_notes: true
          body: |
            Two packages. On Debian or Ubuntu with kernel 6.4 or later and BPF LSM:

            ```sh
            # The daemon, rz and the kernel object. Depends on libc6 and libgcc-s1 only.
            sudo apt install ./ringzero-security_<version>_<arch>.deb

            # Optional desktop viewer. Pulls in the GTK/WebKit stack.
            sudo apt install ./ringzero-desktop_<version>_<arch>.deb
            ```

            Install the daemon package alone on a server. The viewer is read-only:
            changing enforcement is an operator action and needs `sudo rz ...`.

            Verify downloads against `SHA256SUMS-<arch>.txt`. The installer adds
            `bpf` to the GRUB command line and asks for a reboot; until you reboot the
            daemon runs in a degraded, userspace-only mode.

  publish-latest:
    name: publish latest build
    needs: deb
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: List what is being published
        run: ls -la dist
      # The rolling "latest" pre-release is replaced, never edited: deleting it
      # and its tag first means its files are always exactly this build's.
      - name: Replace the latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.deb dist/SHA256SUMS-*.txt \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Latest build from main" \
            --notes "The newest build from main (${GITHUB_SHA::7}), rebuilt on every merge. For a stable version, use the newest v* release.

          \`\`\`sh
          sudo apt install ./ringzero-security_<version>_<arch>.deb
          sudo apt install ./ringzero-desktop_<version>_<arch>.deb   # optional viewer
          \`\`\`

          Verify downloads against SHA256SUMS-<arch>.txt."
