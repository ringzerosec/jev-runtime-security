# SPDX-License-Identifier: Apache-2.0
# Third-party actions are pinned to a commit SHA, not a tag.
#
# A tag is mutable: whoever controls the action repository can move v4 to new
# code, and that code runs in a job with this repository checked out and,
# in the release workflow, a token that can publish. Pinning to a SHA means an
# update is a commit here that someone reviews. The trailing comment on each
# line is the tag or branch that SHA was resolved from.
#
# dtolnay/rust-toolchain encodes the channel in the BRANCH, so `# stable` there
# is not a version — it is the branch whose action.yml defaults `toolchain` to
# stable. The pinned commit keeps that default; check action.yml before moving
# it, because a SHA from a different branch would silently change the channel.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev \
            pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      # The eBPF object (GPL-2.0 side) is compiled at packaging time on a host
      # with kernel BTF (build-deb.sh), not in CI: a GitHub runner has no
      # reliable bpftool/BTF, and that dependency was the only thing failing CI.
      # CI verifies the userspace side; the BPF C still compiles via the Makefile
      # for anyone building locally or a release.

      - name: Build userspace (Apache-2.0 side)
        run: cargo build --release

      - name: Test
        run: cargo test --workspace

      - name: Format
        run: cargo fmt --all -- --check

  desktop-viewer:
    # Separate job on purpose: a GUI build failure must never block the daemon.
    name: desktop viewer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the GTK/WebKit stack
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Build the frontend
        run: |
          cd app/ui
          npm ci
          npm run build

      - name: Typecheck the frontend
        run: cd app/ui && npx tsc --noEmit

      - name: Check the viewer
        run: cargo check -p ringzero-app

  licence-headers:
    name: licence headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Every source file declares its licence
        run: |
          python3 - <<'PY'
          import os, sys
          SLASH = {'.rs','.c','.h','.ts','.tsx','.js','.mjs','.css'}
          HASH  = {'.sh','.py','.toml','.yml','.yaml','Makefile'}
          SKIP  = {'.git','target','node_modules','build','dist','gen'}
          bad = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in SKIP]
              for f in files:
                  p = os.path.join(root, f)
                  ext = 'Makefile' if f == 'Makefile' else os.path.splitext(f)[1]
                  if ext not in SLASH and ext not in HASH:
                      continue
                  if f == 'vmlinux.h':          # generated from kernel BTF
                      continue
                  head = '\n'.join(open(p, encoding='utf-8', errors='ignore').read().splitlines()[:5])
                  if 'SPDX-License-Identifier' not in head:
                      bad.append(p); continue
                  # GPL/ must be GPL-2.0; everything else must be Apache-2.0
                  want = 'GPL-2.0' if p.startswith('./GPL/') else 'Apache-2.0'
                  if want not in head:
                      bad.append(f'{p} (expected {want})')
          if bad:
              print('Files with a missing or wrong licence header:')
              for b in bad: print(' ', b)
              sys.exit(1)
          print('licence headers: ok')
          PY

      - name: No BPF source outside GPL/
        run: |
          stray=$(find . -name '*.bpf.c' -not -path './GPL/*' -not -path './target/*')
          if [ -n "$stray" ]; then
            echo "BPF source outside GPL/ would put GPL code in the Apache tree:"
            echo "$stray"
            exit 1
          fi
          echo "bpf source containment: ok"

  dependency-licences:
    name: dependency licences
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Fail on copyleft or non-OSS licences in the Apache userspace
        run: |
          cargo metadata --format-version 1 --all-features > /tmp/meta.json
          python3 - <<'PY'
          import json, sys, collections
          meta = json.load(open('/tmp/meta.json'))
          DENY = ('GPL-3', 'AGPL', 'SSPL', 'BUSL', 'Commons-Clause')
          counts, flagged = collections.Counter(), []
          for pkg in meta['packages']:
              lic = pkg.get('license') or '(none declared)'
              counts[lic] += 1
              # LGPL and plain GPL-2.0 in a dependency would also be a problem;
              # GPL-2.0-only here refers to our own kernel tree, not a crate.
              if any(d in lic for d in DENY):
                  flagged.append((pkg['name'], pkg['version'], lic))
              if lic == '(none declared)':
                  flagged.append((pkg['name'], pkg['version'], 'no licence declared'))
          for lic, n in counts.most_common():
              print(f'{n:4}  {lic}')
          if flagged:
              print('\nFLAGGED:')
              for name, ver, lic in flagged:
                  print(f'  {name} {ver}: {lic}')
              sys.exit(1)
          print('\ndependency licences: ok')
          PY
