# SPDX-License-Identifier: Apache-2.0
[package]
name    = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rz"
path = "src/main.rs"

[dependencies]
# Used only by `rz checks` to verify a provider key without the daemon: the
# same HTTP transport the daemon uses, so there is one implementation of the
# provider contract rather than two.
ringzero-checks      = { path = "../checks", features = ["http"] }
tokio.workspace      = true
toml.workspace       = true
serde.workspace      = true
serde_json.workspace = true
anyhow.workspace     = true
tracing.workspace    = true
tracing-subscriber.workspace = true
clap.workspace       = true
chrono.workspace     = true
libc                 = "0.2"
